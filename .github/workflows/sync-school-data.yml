name: Sync School Data

on:
  schedule:
    # 毎月1日 JST 0:00 (UTC 15:00)
    - cron: "0 15 1 * *"
  workflow_dispatch: # 手動実行も可能

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch school data from edu-data.jp
        env:
          EDU_DATA_TOKEN: ${{ secrets.EDU_DATA_TOKEN }}
        run: node scripts/fetch-school-data.mjs

      - name: Check for changes
        id: diff
        run: |
          git diff --quiet public/data/schools.json && echo "changed=false" >> $GITHUB_OUTPUT || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/schools.json
          git commit -m "chore: update school data ($(date +%Y-%m))"
          git push
