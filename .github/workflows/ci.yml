name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      # Service Worker が Supabase の API 応答をキャッシュしていないこと（個人データが端末に残り、別のユーザーに返るため）
      - name: Assert service worker does not cache API responses
        run: |
          # 経路の登録は画面遷移用の NavigationRoute（index.html を返す）の1つだけであること。
          # キャッシュ戦略名やキャッシュ名で判定すると、別の名前や独自のハンドラで API の経路が追加されたときに見逃す
          routes=$(grep -o "registerRoute(" dist/sw.js | wc -l | tr -d " ")
          if [ "$routes" -ne 1 ] || ! grep -q "registerRoute(new [A-Za-z_$.]*NavigationRoute(" dist/sw.js; then
            echo "dist/sw.js に画面遷移以外の経路が登録されています（${routes} 件）。vite.config.ts の runtimeCaching を確認してください。"
            exit 1
          fi
          # 経路を使わずに応答を返す・キャッシュする手段（既定や失敗時のハンドラ、キャッシュ戦略、Supabase 向けの設定）がないこと
          if grep -qE "setDefaultHandler|setCatchHandler|NetworkFirst|CacheFirst|StaleWhileRevalidate|NetworkOnly|supabase" dist/sw.js; then
            echo "dist/sw.js に実行時キャッシュやハンドラの設定があります。vite.config.ts の workbox を確認してください。"
            exit 1
          fi
          # importScripts で読み込ませるスクリプトは削除だけを行い、応答を返したりキャッシュに保存したりしないこと（コメント行は除いて判定する）
          if grep -vE "^[[:space:]]*//" public/sw-legacy-cache-cleanup.js | grep -qE "respondWith|caches\.open|\.put\(|\.add(All)?\(|importScripts"; then
            echo "public/sw-legacy-cache-cleanup.js が応答を返すかキャッシュに保存しています。削除以外の処理を入れないでください。"
            exit 1
          fi
          # 以前の 'supabase-cache' を削除する処理を Service Worker が読み込んでいること
          if ! grep -q 'importScripts("sw-legacy-cache-cleanup.js")' dist/sw.js || [ ! -f dist/sw-legacy-cache-cleanup.js ]; then
            echo "dist/sw.js が sw-legacy-cache-cleanup.js を読み込んでいません。vite.config.ts の workbox.importScripts を確認してください。"
            exit 1
          fi

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # e2eに不要なサービスは起動しない（起動時間短縮）
      - name: Start local Supabase
        run: npx supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,postgres-meta,mailpit,realtime

      # マイグレーションとseedから、毎回まっさらなDBを作り直す
      - name: Reset database
        run: npm run supabase:local:reset

      - name: Prepare e2e env
        run: cp .env.e2e.local.example .env.e2e.local

      - name: Type check e2e
        run: npx tsc -p e2e/tsconfig.json

      - name: Run e2e
        id: e2e
        run: npm run test:e2e

      # 実行後にテストデータが残っていないこと（冪等性）を検証する。
      # テストが失敗した場合の後始末も検証するため、e2eが実行された限り成否に関わらず実行する
      - name: Assert no e2e data remains
        if: ${{ !cancelled() && steps.e2e.conclusion != 'skipped' }}
        run: npm run test:e2e:assert-clean

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
