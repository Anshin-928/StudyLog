name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # e2eに不要なサービスは起動しない（起動時間短縮）
      - name: Start local Supabase
        run: npx supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,postgres-meta,mailpit,realtime

      # マイグレーションとseedから、毎回まっさらなDBを作り直す
      - name: Reset database
        run: npm run supabase:local:reset

      - name: Prepare e2e env
        run: cp .env.e2e.local.example .env.e2e.local

      - name: Type check e2e
        run: npx tsc -p e2e/tsconfig.json

      - name: Run e2e
        id: e2e
        run: npm run test:e2e

      # 実行後にテストデータが残っていないこと（冪等性）を検証する。
      # テストが失敗した場合の後始末も検証するため、e2eが実行された限り成否に関わらず実行する
      - name: Assert no e2e data remains
        if: ${{ !cancelled() && steps.e2e.conclusion != 'skipped' }}
        run: npm run test:e2e:assert-clean

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
